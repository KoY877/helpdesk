spring.application.name=helpdesk_db
spring.config.import=optional:file:../.env[.properties]
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
# Use the public proxy callback in production; keep Spring's default for local runs.
spring.security.oauth2.client.registration.github.redirect-uri=${GITHUB_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/helpdesk_db
spring.datasource.username=${DB_USERNAME:CHANGE_ME}
spring.datasource.password=${DB_PASSWORD:CHANGE_ME}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=${SERVER_PORT:8081}

# CORS Configuration (consumed by CorsProperties)
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200}
cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
cors.allowed-headers=Authorization,Content-Type,Accept,Origin,X-Requested-With
cors.allow-credentials=true
cors.max-age=3600

# JWT Configuration (consumed by JwtProperties)
# Use a strong, long, random Base64 string in production
jwt.secret=${JWT_SECRET}
# Access token expiration in ms (1 hour = 3600000)
jwt.access-token.expiration=${JWT_ACCESS_EXPIRATION:3600000}
# Refresh token expiration in ms (7 days = 604800000)
jwt.refresh-token.expiration=${JWT_REFRESH_EXPIRATION:604800000}
