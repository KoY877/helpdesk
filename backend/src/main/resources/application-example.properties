spring.application.name=helpdesk_db

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/helpdesk_db
spring.datasource.username=${DB_USERNAME:CHANGE_ME}
spring.datasource.password=${DB_PASSWORD:CHANGE_ME}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Configuration
server.port=${SERVER_PORT:8081}

# CORS Configuration (consumed by CorsProperties)
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200}
cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
cors.allowed-headers=Authorization,Content-Type,Accept,Origin,X-Requested-With
cors.allow-credentials=true
cors.max-age=3600

# JWT Configuration (consumed by JwtProperties)
# Use a strong, long, random Base64 string in production
jwt.secret=${JWT_SECRET:CHANGE_ME}
# Access token expiration in ms (1 hour = 3600000)
jwt.access-token.expiration=${JWT_ACCESS_EXPIRATION:3600000}
# Refresh token expiration in ms (7 days = 604800000)
jwt.refresh-token.expiration=${JWT_REFRESH_EXPIRATION:604800000}
