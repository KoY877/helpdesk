

<div class="users-container">

  <!-- Header with the page title and an admin-only badge -->
  <div class="users-header">
    <h1>User management</h1>

    <div class="admin">
      @if (role === 'ADMIN') {
        Admin only
      }
    </div>
  </div>


  <!-- Free-text search over the user list -->
  <div class="search-box">
    <mat-icon>search</mat-icon>
    <input (keyup)="applyFilter($event)" placeholder="Search users..." #input>
  </div>

  <!-- Users table -->
  <div class="tableLayout">
    <div class="table-scroll">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

      <ng-container matColumnDef="order">
        <th mat-header-cell *matHeaderCellDef>#</th>
        <td mat-cell *matCellDef="let user; let i = index">{{ i + 1 }}</td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let user">
          <div class="user-name">
            <div class="avatar">{{ initialsFor(user.name) }}</div>
            <div class="name">{{ user.name }}</div>
          </div>
        </td>
      </ng-container>

       <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let user">
          {{ user.email }}
        </td>
      </ng-container>

      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef>Role</th>
        <td mat-cell *matCellDef="let user">
          <span [class]="roleClass(user.role)">
            {{ user.role }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef>Created</th>
        <td mat-cell *matCellDef="let user">{{ user.createdAt | date:'short' }}</td>
      </ng-container>

      <!-- Per-user actions: change role via a menu, or delete the user -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let user">
          <div class="button-row">
            <button mat-stroked-button [matMenuTriggerFor]="roleMenu">
              Edit role
              <mat-icon>arrow_drop_down</mat-icon>
            </button>
            <mat-menu #roleMenu="matMenu">
              <!-- One entry per role; the user's current role is disabled -->
              @for (role of roles; track role) {
                <button mat-menu-item
                        [disabled]="user.role === role"
                        (click)="handleRoleChange(user.id, role)">
                  {{ role }}
                </button>
              }
            </mat-menu>
            <button mat-flat-button class="btn-delete" aria-label="Delete user" (click)="handleDelete(user.id)">Delete</button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    </div>

    <mat-paginator [pageSizeOptions]="[5, 10, 20]"
                  showFirstLastButtons
                  aria-label="Select page of users" >
    </mat-paginator>
  </div>

</div>
