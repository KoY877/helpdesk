<div class="settings-content">

  <!-- Editable profile information card -->
  <mat-card class="settings-card">
    <mat-card-header>
      <mat-card-title>Profile information</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <!-- Success / error feedback banners -->
      <div *ngIf="successMessage()" class="alert success">{{ successMessage() }}</div>
      <div *ngIf="errorMessage()" class="alert error">{{ errorMessage() }}</div>

      <!-- Profile edit form -->
      <form [formGroup]="form" (ngSubmit)="onSave()">
        <div class="field-row">
          <mat-form-field appearance="outline">
            <mat-label>Name</mat-label>
            <input matInput formControlName="name" type="text">
            <mat-error *ngIf="form.get('name')?.hasError('required')">
              Name is required
            </mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Email</mat-label>
            <input matInput formControlName="email" type="email">
            <mat-error *ngIf="form.get('email')?.hasError('required')">
              Email is required
            </mat-error>
            <mat-error *ngIf="form.get('email')?.hasError('email')">
              Invalid email format
            </mat-error>
          </mat-form-field>
        </div>

        <button mat-flat-button type="submit" [disabled]="form.invalid">
          Save changes
        </button>
      </form>
    </mat-card-content>
  </mat-card>

  <!-- Danger zone: irreversible account deletion -->
  <mat-card class="settings-card danger">
    <mat-card-header>
      <mat-card-title class="danger-title">Danger zone</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <p class="danger-text">Permanently delete your account and all associated data.</p>
      <!-- Disabled while a deletion request is in flight -->
      <button mat-flat-button class="delete-button" (click)="onDelete()" [disabled]="deleting()">
        Delete account
      </button>
    </mat-card-content>
  </mat-card>

</div>
