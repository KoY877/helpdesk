<div class="settings-content">

  <!-- Change-password card -->
  <mat-card class="settings-card">
    <mat-card-header>
      <mat-card-title>Change password</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <!-- Success / error feedback banners -->
      <div *ngIf="successMessage()" class="alert success">{{ successMessage() }}</div>
      <div *ngIf="errorMessage()" class="alert error">{{ errorMessage() }}</div>

      <!-- Password change form -->
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline">
          <mat-label>Current password</mat-label>
          <input matInput formControlName="currentPassword" type="password">
          <mat-error *ngIf="form.get('currentPassword')?.hasError('required')">
            Current password is required
          </mat-error>
        </mat-form-field>

        <div class="field-row">
          <mat-form-field appearance="outline">
            <mat-label>New password</mat-label>
            <input matInput formControlName="newPassword" type="password">
            <mat-error *ngIf="form.get('newPassword')?.hasError('required')">
              New password is required
            </mat-error>
            <mat-error *ngIf="form.get('newPassword')?.hasError('minlength')">
              Minimum 12 characters
            </mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Confirm password</mat-label>
            <input matInput formControlName="confirmPassword" type="password">
            <mat-error *ngIf="form.get('confirmPassword')?.hasError('required')">
              Please confirm your password
            </mat-error>
          </mat-form-field>
        </div>

        <!-- Cross-field error shown when the two passwords differ -->
        <div *ngIf="form.hasError('mismatch') && form.get('confirmPassword')?.touched" class="alert error">
          Passwords do not match
        </div>

        <button mat-flat-button type="submit" [disabled]="form.invalid">
          Update password
        </button>
      </form>
    </mat-card-content>
  </mat-card>

</div>
